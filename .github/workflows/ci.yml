name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install packages
        run: |
            sudo apt install markdownlint
      - name: Lint markdown
        run: mdl ./README.md
      - name: Lint shell code
        run: shellcheck ./**/*.sh
      - name: Run regression checks
        run: bash tests/test_validation.sh
